name: prepmind_app
description: AI-powered exam preparation app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage & encryption
  shared_preferences: ^2.3.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # File handling
  file_picker: ^8.1.2

  # AI content rendering
  flutter_markdown: ^0.7.3
  lottie: ^3.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  firebase_performance: ^0.10.1+10
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.17
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.9.0+3
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

# For information on the generic Dart part of this file, see the
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
